targets:
  $default:
    builders:
      drift_dev:
        options:
          databases:
            default: lib/data/db/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
          store_date_time_values_as_text: true
          sql:
            dialect: sqlite
            options:
              version: "3.45"
              modules: [fts5]
      drift_dev:preparing_builder:
        options:
          store_date_time_values_as_text: true
          sql:
            dialect: sqlite
            options:
              version: "3.45"
              modules: [fts5]
